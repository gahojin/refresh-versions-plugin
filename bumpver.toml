[bumpver]
current_version = "v0.9.1"
version_pattern = "vMAJOR.MINOR.PATCH"
commit_message = "chore: bump version {old_version_pep440} -> {new_version_pep440}"
pre_commit_hook = ""
post_commit_hook = ""
commit = true
tag = false
push = false

[bumpver.file_patterns]
"plugin-build/plugin/build.gradle.kts" = [
    'version = "{pep440_version}"',
]
"README.md" = [
    'id("jp.co.gahojin.refreshVersions") version "{pep440_version}"'
]
"example/settings.gradle.kts" = [
    'id("jp.co.gahojin.refreshVersions") version "{pep440_version}"'
]
